[pytest]
testpaths = tests
# Every async test is awaited without needing @pytest.mark.asyncio. In strict
# mode an unmarked async test is collected, never awaited, and reported as
# passed with only a RuntimeWarning to show for it (issue #107).
asyncio_mode = auto
filterwarnings =
    # A never-awaited coroutine is a test that did not run; make it fail.
    error::RuntimeWarning
